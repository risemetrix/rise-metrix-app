:root{
  --gold:#F2C94C; --ink:#1A1B1E; --inktxt:#0F0E0C;
  --bg:#FAF9F8; --card:#FFFFFF; --line:rgba(26,27,30,.08); --mut:rgba(26,27,30,.55); --mut2:rgba(26,27,30,.45);
  --shadow:0 8px 20px rgba(26,27,30,.08); --glow:none; --red:#D44A3E;
}
html.dark{
  --ink:#FAFAF8; --bg:#0D0E14; --card:#14161F; --line:rgba(250,250,248,.09);
  --mut:rgba(250,250,248,.55); --mut2:rgba(250,250,248,.4);
  --shadow:0 8px 24px rgba(0,0,0,.4); --glow:0 0 18px rgba(242,201,76,.45);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,system-ui,sans-serif;min-height:100vh}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:0}
.hd{font-family:'Hudson NY Serif','Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:900}
main{padding:8px 20px 110px}
h1.hd{font-size:34px;letter-spacing:.5px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 0;font-size:13px;font-weight:600}
.topbar .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:var(--glow)}
.ul{height:8px;background:var(--gold);margin:5px 0 6px;clip-path:polygon(0 55%,calc(100% - 7px) 55%,100% 0,100% 100%,0 100%)}
.sub{font-size:10px;letter-spacing:.12em;color:var(--mut2);font-weight:600;text-transform:uppercase}
.chip{background:var(--gold);color:var(--inktxt);font-family:'Hudson NY Serif','Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:900;font-size:18px;padding:4px 12px;border-radius:5px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;margin-top:12px}
.card.gold{border:1.5px solid var(--gold)}
.hexwrap{position:relative;width:46px;height:46px;flex:0 0 46px}
.hexwrap::before{content:"";position:absolute;inset:0;background:rgba(128,128,128,.5);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.hexwrap.gold::before{background:var(--gold)}
.hexwrap .hex{position:absolute;inset:2px;display:flex;align-items:center;justify-content:center;background:var(--bg);
 clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);font-family:'Hudson NY Serif','Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:900;font-size:15px}
.hexwrap.sm{width:38px;height:38px;flex:0 0 38px}
.row{display:flex;align-items:center;gap:12px}
.gold-num{font-family:'Hudson NY Serif','Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:900;color:var(--gold);text-shadow:var(--glow)}
.ink-num{font-family:'Hudson NY Serif','Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:900}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:1}
.fill{height:100%;background:var(--gold);border-radius:3px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.btn{display:block;width:100%;background:var(--gold);color:var(--inktxt);border:none;border-radius:10px;padding:15px;
 font-family:'Hudson NY Serif','Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:900;font-size:22px;letter-spacing:.5px;cursor:pointer;box-shadow:var(--shadow)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line);font-size:18px;padding:12px}
.btn.danger{background:none;color:var(--red);border:1px solid var(--red);font-size:16px;padding:10px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:12px 0 26px;z-index:5}
nav button{background:none;border:none;cursor:pointer;font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--mut2);display:flex;flex-direction:column;align-items:center;gap:5px}
nav button.on{color:var(--gold)}
nav .ic{width:20px;height:20px;border:2px solid currentColor;border-radius:4px}
nav .ic.circ{border-radius:50%}
nav .ic.hexi{border:none;background:currentColor;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
nav .ic.bars{border:none;display:flex;align-items:flex-end;gap:2px}
nav .ic.bars i{width:4px;background:currentColor;display:block}
nav .ic.tape{border-radius:2px;height:14px;margin-top:3px}
.marker{font-family:'Permanent Marker';color:var(--gold);text-shadow:var(--glow)}
.tag{font-size:9px;letter-spacing:.14em;color:var(--mut2);font-weight:700;text-transform:uppercase}
.pill{border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px;cursor:pointer;background:var(--card);color:var(--ink)}
.pill.on{background:var(--gold);color:var(--inktxt);border-color:var(--gold)}
.pill.mini{padding:5px 10px;font-size:12px}
.qa{border:1.5px solid var(--gold);background:none;color:var(--ink);border-radius:8px;font-family:'Hudson NY Serif','Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:900;font-size:15px;padding:4px 10px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);background:var(--inktxt);color:var(--gold);
 font-family:'Hudson NY Serif','Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:900;font-size:20px;padding:10px 22px;border-radius:10px;opacity:0;pointer-events:none;transition:all .35s;white-space:nowrap;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.small{font-size:12px;color:var(--mut)}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-family:inherit;font-size:15px;font-weight:600}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:transparent}
label.sub{display:block;margin:14px 0 6px}
.feeditem{animation:pop .4s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.tiercell{text-align:center;flex:1}
.tiercell .hx{width:52px;height:52px;margin:0 auto 6px;background:var(--line);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.tiercell.on .hx{background:var(--gold);box-shadow:var(--glow)}
.tiercell .nm{font-family:'Hudson NY Serif','Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:900;font-size:12px;color:var(--mut2)}
.tiercell.on .nm{color:var(--gold)}
.tiercell .rg{font-size:9px;color:var(--mut2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:10px}
.seg button{flex:1;border:none;background:none;color:var(--ink);opacity:.55;padding:10px;font-family:'Hudson NY Serif','Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:900;font-size:17px;cursor:pointer}
.seg button.on{background:var(--inktxt);color:var(--gold);opacity:1}
.back{background:none;border:none;color:var(--ink);font-size:22px;font-weight:800;cursor:pointer;padding:4px 10px 4px 0}
.stepdot{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block;margin-right:6px}
.stepdot.on{background:var(--gold)}
.spark{stroke:var(--gold);stroke-width:2.5;fill:none}
.listrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.listrow:last-child{border-bottom:none}
.x{background:none;border:none;color:var(--mut2);font-size:18px;cursor:pointer;font-weight:700}
/* ===== motion system (from Figma animated onboarding: fade + rise + scale, ease-out) ===== */
.card{animation:pop .32s cubic-bezier(.2,.8,.2,1) both}
.card:nth-of-type(2){animation-delay:.05s}.card:nth-of-type(3){animation-delay:.1s}
.card:nth-of-type(4){animation-delay:.15s}.card:nth-of-type(5){animation-delay:.2s}
.card:nth-of-type(n+6){animation-delay:.24s}
@keyframes rowIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.listrow{animation:rowIn .28s ease-out both}
.listrow:nth-child(2){animation-delay:.03s}.listrow:nth-child(3){animation-delay:.06s}
.listrow:nth-child(4){animation-delay:.09s}.listrow:nth-child(5){animation-delay:.12s}
.listrow:nth-child(6){animation-delay:.15s}.listrow:nth-child(n+7){animation-delay:.18s}
.pill:active,.qa:active,.seg button:active{transform:scale(.95)}
.pill,.qa,.btn,.seg button{transition:transform .12s ease}
.toast.show{animation:toastBounce .4s cubic-bezier(.2,.8,.2,1)}
@keyframes toastBounce{0%{transform:translateX(-50%) translateY(16px) scale(.92)}60%{transform:translateX(-50%) translateY(-3px) scale(1.02)}100%{transform:translateX(-50%) translateY(0) scale(1)}}
/* welcome intro */
.logoIn{overflow:visible}
.logoIn path{transform-box:fill-box;transform-origin:center}
.logoIn .lgBolt{animation:boltStrike .55s cubic-bezier(.2,.8,.2,1) .15s both,boltGlow 1.2s ease-out .15s both}
@keyframes boltStrike{0%{opacity:0;transform:translateY(26px) scaleY(.6)}55%{opacity:1;transform:translateY(-3px) scaleY(1.04)}78%{transform:translateY(1px)}100%{transform:none}}
@keyframes boltGlow{0%,15%{filter:none}35%{filter:drop-shadow(0 0 16px rgba(242,201,76,.95))}100%{filter:drop-shadow(0 0 4px rgba(242,201,76,.25))}}
.logoIn path:not(.lgBolt){animation:fadeUp .5s ease-out .45s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.iu{animation:fadeUp .5s ease-out both}
/* celebration */
.celebrate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:200}
.celebrate .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(242,201,76,.3),transparent 55%);animation:celebF 1s ease-out both}

<script>
"use strict";
/* ================= ENGINE (mirrors rise-metrix-engine, 19/19 tests) ================= */
const STD={
 squat:{9:{p0:95,p50:205,p99:315},10:{p0:115,p50:240,p99:365},11:{p0:135,p50:270,p99:405},12:{p0:155,p50:300,p99:445}},

 forty:{9:{light:{p0:6.4,p50:5.35,p99:4.7,lo:1},medium:{p0:6.5,p50:5.45,p99:4.8,lo:1},heavy:{p0:6.9,p50:5.9,p99:5.1,lo:1}},
  10:{light:{p0:6.3,p50:5.25,p99:4.6,lo:1},medium:{p0:6.4,p50:5.35,p99:4.7,lo:1},heavy:{p0:6.8,p50:5.8,p99:5.0,lo:1}},

 vertical:{9:{light:{p0:10,p50:20,p99:30},medium:{p0:9,p50:19,p99:29},heavy:{p0:7,p50:15,p99:24}},
  10:{light:{p0:11,p50:21,p99:32},medium:{p0:10,p50:20,p99:31},heavy:{p0:8,p50:16,p99:26}},

const BCK=new Set(["forty","vertical"]), UNI=new Set(["gpa","attendance"]);
const METRIC_LABEL={squat:"Squat (lb)",bench:"Bench (lb)",clean:"Clean (lb)",forty:"40-yd (s)",vertical:"Vertical (in)",gpa:"GPA",attendance:"Attend %"};
const bodyClass=(h,w)=>{if(!h||!w)return"medium";const b=w/(h*h)*703;return b<23?"light":b<29?"medium":"heavy"};
function curve(m,g,bc){const t=STD[m];if(UNI.has(m))return t.all;const gg=t[Math.min(12,Math.max(9,g||11))];return BCK.has(m)?gg[bc]:gg}
function scoreMetric(m,v,g,bc){if(v==null||v==="")return null;v=+v;if(Number.isNaN(v))return null;
 const c=curve(m,g,bc);const L=(x,a,b,sa,sb)=>sa+(x-a)/(b-a)*(sb-sa);let s;
 if(c.lo){if(v<=c.p99)s=99;else if(v<=c.p50)s=L(v,c.p50,c.p99,50,99);else if(v<=c.p0)s=L(v,c.p0,c.p50,0,50);else s=0}
 else{if(v>=c.p99)s=99;else if(v>=c.p50)s=L(v,c.p50,c.p99,50,99);else if(v>=c.p0)s=L(v,c.p0,c.p50,0,50);else s=0}
 return Math.max(0,Math.min(99,s))}
function need99(m,g,bc){return curve(m,g,bc).p99}
function objScore(p,W){const bc=bodyClass(p.h,p.w);let ws=0,acc=0;
 for(const[m,wt]of Object.entries(W)){if(wt<=0)continue;const s=scoreMetric(m,(p.mx||{})[m],p.grade,bc);
  if(s==null)continue;ws+=wt;acc+=s*wt}
 return ws?acc/ws:null}
function cultPct(pts,all){const n=all.length;if(n<=1)return 50;
 const below=all.filter(x=>x<pts).length,eq=all.filter(x=>x===pts).length;
 return 1+((below+(eq-1)/2)/(n-1))*98}

 if(o==null)return Math.round(c);return Math.round(obj*o+(1-obj)*c)}

  restDays:[0],bonuses:[[5,5],[10,10]],ratingVisible:true},
 culture:{id:"culture",name:"Culture Only",weights:{obj:0,subj:1},
  metricWeights:{},
  activities:[["Effort",10,"performance"],["Leadership",15,"citizen"],["Teammate",10,"citizen"],["Community",20,"citizen"],["Classroom",5,"classroom"]],

const KEY="risemetrix.t."+(window.RMX_SLOT||"a");
var S=null;
function blank(){return {v:1,role:"coach",dark:false,team:null,players:[],events:[],feed:[],

function uid(){return S.seq++}
const today=()=>new Date().toISOString().slice(0,10);
const now=()=>Date.now();
/* ================= DERIVED ================= */
function ptsOf(p){return S.events.filter(e=>e.pids.includes(p.id)).reduce((a,e)=>a+e.pts,0)}
function board(){const ps=S.players;if(!ps.length)return[];
 const all=ps.map(ptsOf);
 const kindPts=k=>ps.map(p=>S.events.filter(e=>e.pids.includes(p.id)&&catKind(e.cat)===k).reduce((a,e)=>a+e.pts,0));
 const allTan=kindPts("tan"),allInt=kindPts("int");
 const rows=ps.map((p,i)=>{const o=objScore(p,S.team.cfg.metricWeights);
  const tp=cultPct(allTan[i],allTan),ip=cultPct(allInt[i],allInt);
  const tan=o!=null?0.6*o+0.4*tp:tp;
  const g=gritOf(tan,ip,S.team.cfg.weights);
  return {...p,pts:all[i],obj:o,tan:Math.round(tan),cult:Math.round(ip),grit:g,tier:tierFor(g)}});
 return rows.sort((a,b)=>b.grit-a.grit||b.pts-a.pts)}
function streakOf(p){const rest=new Set(S.team.cfg.restDays);
 const days=new Set(S.events.filter(e=>e.pids.includes(p.id)).map(e=>e.date));
 let st=0,d=new Date();
 for(let i=0;i<400;i++){const iso=d.toISOString().slice(0,10);
  const sched=!rest.has(d.getUTCDay());
  if(sched){if(days.has(iso))st++;else if(iso===today()){/*today open*/}else break}
  d=new Date(d.getTime()-86400000)}
 return st}
function badgesOf(p){const mx=p.mx||{};const sum=(+mx.squat||0)+(+mx.bench||0)+(+mx.clean||0);
 const st=streakOf(p);
 const film=S.events.filter(e=>e.pids.includes(p.id)&&e.act==="Film Study").length;
 const tf=S.events.filter(e=>e.pids.includes(p.id)&&e.act==="Trivia First").length;
 return [
  {id:"club1000",n:"1,000 LB CLUB",ok:sum>=1000,d:sum?sum+" total":"no maxes yet"},
  {id:"countonme",n:"COUNT ON ME",ok:st>=20,d:"streak "+st+"/20"},
  {id:"ironman",n:"IRON MAN",ok:(+mx.attendance||0)>=100,d:(mx.attendance||0)+"% attendance"},
  {id:"filmrat",n:"FILM RAT",ok:film>=10,d:film+"/10 film sessions"},
  {id:"firstin",n:"FIRST IN",ok:tf>=5,d:tf+"/5 trivia firsts"},
 ]}
function snapshotToday(){if(!S.team)return;const t=today();
 if(!S.snapshots[t]){const m={};board().forEach(p=>m[p.id]=p.grit);S.snapshots[t]=m;
  const keys=Object.keys(S.snapshots).sort();while(keys.length>30){delete S.snapshots[keys.shift()]}save()}}
function weekDelta(p){const keys=Object.keys(S.snapshots).sort();
 if(keys.length<2)return null;
 const past=keys.filter(k=>k<=new Date(Date.now()-6*86400000).toISOString().slice(0,10));
 const ref=past.length?past[past.length-1]:keys[0];
 const old=S.snapshots[ref]?.[p.id];return old==null?null:p.grit-old}
/* ================= MUTATIONS ================= */
function award(pids,act,pts,cat,note,silent){const e={id:uid(),pids:[...pids],act,pts,cat:cat||"performance",note:note||"",by:S.role,date:today(),ts:now()};
 const beforeT=Object.fromEntries(board().map(p=>[p.id,p.tier]));

 if(window.RMXCloud)RMXCloud.pushEvent(S,e);

 const t=today();const seed=[...t].reduce((a,c)=>a+c.charCodeAt(0),0);
 const withFacts=S.players.filter(p=>p.fact);
 let target,fact;
 if(withFacts.length){target=withFacts[seed%withFacts.length];fact=target.fact}
 else{target=S.players[seed%S.players.length];fact=GENERIC_Q[seed%GENERIC_Q.length][0]}
 const others=S.players.filter(p=>p.id!==target.id);
 const opts=[target];
 for(let i=0;i<3&&i<others.length;i++)opts.push(others[(seed+i*7)%others.length]);

 S.team={name,season,code,cfg,createdAt:now()};

function seedDemo(){
 const cfg=JSON.parse(JSON.stringify(TEMPLATES.grind));
 S.team={name:"Varsity Football",season:"2026 Off-Season",code:"TROY26",cfg,createdAt:now()};

 ["Jay Brooks","WR",12,73,210,{squat:405,bench:265,clean:235,forty:4.95,vertical:30,gpa:2.7,attendance:88},"listens to country before games"],
 ["Marcus Diaz","OL",11,74,265,{squat:425,bench:275,clean:240,forty:5.4,gpa:3.0,attendance:94},""],
 ["Trey Walker","DB",10,69,160,{squat:245,forty:4.75,vertical:30,gpa:3.4,attendance:90},"has never lost at ping pong"],
 ["Ethan Brown","LB",12,72,220,{gpa:2.9,attendance:85},""]];
 demo.forEach(d=>{S.players.push({id:uid(),n:d[0],i:initials(d[0]),pos:d[1],grade:d[2],h:d[3],w:d[4],mx:d[5],fact:d[6]})});
 // seed a week of events
 const acts=cfg.activities;
 for(let day=20;day>=1;day--){const date=new Date(Date.now()-day*86400000);
  if(cfg.restDays.includes(date.getUTCDay()))continue;
  const iso=date.toISOString().slice(0,10);
  const a=acts[day%6]; // rotate the six core activities — negatives stay coach-triggered
  S.players.forEach((p,ix)=>{if((ix+day)%7!==6){S.events.push({id:uid(),pids:[p.id],act:a[0],pts:a[1],cat:a[2],note:"",by:"coach",date:iso,ts:now()-day*86400000})}})}
 S.events.push({id:uid(),pids:[S.players[0].id],act:"7-on-7",pts:15,cat:"performance",note:"full-speed effort",by:"coach",date:today(),ts:now()});
 // squads: drafted crews with captains
 S.team.cfg.squads=[{id:"q1",name:"CHIEFS",leader:S.players[0].id},{id:"q2",name:"EAGLES",leader:S.players[1].id},{id:"q3",name:"LIONS",leader:S.players[3].id}];
 S.players.forEach((p,i)=>{p.sq="q"+((i%3)+1)});
 S.players[0].sq="q1";S.players[1].sq="q2";S.players[3].sq="q3";
 // a live Game Ball vote so HUDDLE shows the full loop
 S.vote={title:"Practice Player of the Week",pts:25,cands:[S.players[0].id,S.players[1].id,S.players[3].id,S.players[5].id],
  counts:{[S.players[0].id]:3,[S.players[1].id]:2,[S.players[5].id]:1},voters:{p901:S.players[0].id,p902:S.players[0].id,p903:S.players[0].id,p904:S.players[1].id,p905:S.players[1].id,p906:S.players[5].id},approved:false,openedTs:now()};
 // a rich week on The Tape
 const F=(h,who,amt,d,tag,hot)=>S.feed.push({ts:now()-h*3600000,who,amt,d,tag,hot:hot?1:0});
 F(2,"Seth Rigney","+15","7-on-7 — full-speed effort","AWARD");
 F(5,"Trey Walker","NEW PR","40-yd (s) 4.81 → 4.75","PR",1);
 F(8,"CHIEFS","+10 each","Weight Room — whole crew showed","TEAM");
 F(20,"Carmen Sanchez","+2","Teammate Trivia — first in","TRIVIA");
 F(26,"Jay Brooks","went GOLD","GRIT crossed 80","TIER",1);
 F(30,"Marcus Diaz","+20","Community Service — youth camp setup","AWARD");
 F(45,"Ethan Brown","-10","Tardy — 2nd period","AWARD");
 F(50,"WHOLE TEAM","DRAFT LOCKED","CHIEFS vs EAGLES vs LIONS","SQUADS",1);
 F(70,"Sam Keller","GAME BALL +25","Practice Player of the Week — voted by the team, approved by coach","VOTE",1);
 pushFeed({who:"WHOLE TEAM",amt:"SEASON LIVE",d:"Demo roster loaded — Off-Season Grind",tag:"TEAM",hot:1});
 S.feed.sort((a,b)=>b.ts-a.ts);
 // huddle life: 4-day trivia streak, today's pulse, a live coach challenge
 for(let dd=4;dd>=1;dd--){const iso2=new Date(Date.now()-dd*86400000).toISOString().slice(0,10);S.trivia.answers[iso2]={pid:S.players[0].id,answerId:1,correct:true}}
 S.trivia.pulse={date:today(),ids:S.players.slice(0,4).map(p=>p.id)};
 S.team.cfg.challenge={t:"First 5 in the weight room before 7am",p:15,d:today()};
 // three weeks on the books: season started 20 days ago, snapshots backfilled daily
 S.team.createdAt=now()-20*86400000;
 const allEv=S.events;
 for(let d=14;d>=1;d--){const iso=new Date(Date.now()-d*86400000).toISOString().slice(0,10);
  S.events=allEv.filter(e=>e.date<=iso);
  const m={};board().forEach(p=>m[p.id]=p.grit);S.snapshots[iso]=m}
 S.events=allEv;
 S.viewAs=S.players[0].id;
 save();tab="board";render();toast("DEMO TEAM LOADED")}
/* ================= MAIN VIEWS ================= */
function wkPills(cur,fn){const nW=weekNum();if(nW<2)return "";
 let h='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">';
 for(let w=1;w<=nW;w++){const live=w===nW;
  h+=`<button class="pill mini ${ (cur==null&&live)||cur===w?"on":""}" onclick="${fn}(${live?"null":w})">WK ${w}${live?" · LIVE":""}</button>`}
 return h+"</div>"}
function setViewWk(w){viewWk=w;render()}
function setTapeWk(w){tapeWk=w;render()}
function snapAtWeek(w){const end=new Date(S.team.createdAt+w*7*86400000).toISOString().slice(0,10);
 const days=Object.keys(S.snapshots).sort().filter(d=>d<=end);
 return days.length?{date:days[days.length-1],map:S.snapshots[days[days.length-1]]}:null}
function vBoardRewind(w){const snap=snapAtWeek(w);
 V.innerHTML=header("LEADERBOARD","WK "+w)+
 `<div class="sub" style="margin-top:2px">${esc(S.team.name)} — AS IT STOOD AT THE END OF WEEK ${w}</div>`+segBoard()+wkPills(w,"setViewWk");
 if(!snap){V.innerHTML+=`<div class="card"><div class="small">No snapshot saved for that week — the app keeps about 30 days of daily history.</div></div>`;return}
 const prev=w>1?snapAtWeek(w-1):null;
 const rows=S.players.map(p=>({p,g:snap.map[p.id]})).filter(r=>r.g!=null).sort((a,b)=>b.g-a.g);
 V.innerHTML+=rows.map((r,i)=>{const d=prev&&prev.map[r.p.id]!=null?r.g-prev.map[r.p.id]:null;
  return `<div class="card row" style="padding:10px 14px">
  <span class="ink-num" style="font-size:18px;width:20px;color:${i===0?"var(--gold)":"var(--mut2)"}">${i+1}</span>
  ${hexEl(r.p,i===0,1)}
  <div style="flex:1;font-weight:700;font-size:14px">${esc(r.p.n)}</div>
  ${d!=null&&d!==0?`<span style="font-weight:800;font-size:12px;color:${d>0?"var(--gold)":"var(--red)"}">${d>0?"\u25b2":"\u25bc"}${Math.abs(d)}</span>`:""}
  <div style="text-align:right;width:40px"><div class="${i===0?"gold-num":"ink-num"}" style="font-size:22px">${r.g}</div><div class="tag">GRIT</div></div></div>`}).join("")+
 `<div class="marker" style="font-size:12px;text-align:center;margin:14px 0">history is read-only — tap WK ${weekNum()} to get back to live</div>`}

 if(boardSub==="squads"){vBoardSquads();return}

 </div>`}).join("")+
 (isCoach()&&rv?`<div class="card row" style="justify-content:space-between"><span class="small" style="font-weight:600">TANGIBLE ${Math.round(S.team.cfg.weights.obj*100)}% / INTANGIBLE ${Math.round((1-S.team.cfg.weights.obj)*100)}%</span>

/* ================= SQUADS (leader-drafted crews) ================= */
var boardSub="players", draftUI=null, trendSel=null, viewWk=null, tapeWk=null, openSq=null;
function squadsOf(){return (S.team&&S.team.cfg.squads)||[]}
function squadName(id){const s=squadsOf().find(x=>x.id===id);return s?s.name:""}
function squadStats(){const rows=board();
 return squadsOf().map(sq=>{const mem=rows.filter(p=>p.sq===sq.id);
  const tot=mem.reduce((a,p)=>a+p.pts,0);
  return {...sq,members:mem,tot,avg:mem.length?Math.round(tot/mem.length):0}})
 .sort((a,b)=>b.avg-a.avg)}
function vBoardSquads(){const st=squadStats();
 if(!st.length){V.innerHTML=header("SQUADS")+
  `<div class="card"><div class="small">No squads yet. Pick your leaders and let them draft their crews.</div>
  ${isCoach()?'<button class="btn" style="margin-top:12px" onclick="tab=\'draft\';render()">SET UP THE DRAFT</button>':""}</div>`+segBoard();return}
 const max=Math.max(1,st[0].avg);
 V.innerHTML=header("LEADERBOARD","WK "+weekNum())+segBoard()+
 st.map((s,i)=>`<div class="card ${i===0?"gold":""}" style="cursor:pointer" onclick="openSq='${s.id}';tab='squad';render()">
  <div class="row" style="justify-content:space-between">
   <div class="row" style="gap:10px"><span class="ink-num" style="font-size:24px;${i===0?"color:var(--gold)":"opacity:.4"}">${i+1}</span>
    <div><div class="hd" style="font-size:22px">${esc(s.name)}</div>
    <div class="marker" style="font-size:12px">C: ${esc((S.players.find(p=>p.id===s.leader)||{n:"—"}).n.split(" ")[0])}</div></div></div>
   <div style="text-align:right"><div class="${i===0?"gold-num":"ink-num"}" style="font-size:32px">${s.avg}</div>
   <div class="tag">AVG PTS / PLAYER</div></div></div>
  <div class="small" style="margin-top:8px">${s.members.map(m=>esc(m.n.split(" ")[0])).join(" · ")||"no members"}</div>
  <div class="track" style="margin-top:8px"><div class="fill" style="width:${Math.round(s.avg/max*100)}%"></div></div>
 </div>`).join("")+
 `<div class="marker" style="font-size:12px;text-align:center;margin:14px 0">squads drafted by your leaders — every rep counts for the crew</div>`+
 (isCoach()?`<button class="btn sec" onclick="tab='draft';render()">RE-DRAFT SQUADS</button>`:"");}
function segBoard(){return `<div class="seg"><button class="${boardSub==="players"?"on":""}" onclick="boardSub='players';render()">PLAYERS</button>

function vTrends(){
 const days=Object.keys(S.snapshots).sort();
 const rows=board();
 V.innerHTML=header("TRENDS","WK "+weekNum())+segBoard()+`<div id="trBody"></div>`;
 const B=document.getElementById("trBody");
 if(days.length<2||!rows.length){B.innerHTML=`<div class="card"><div class="small">Trends build up after a couple days of scoring — the app snapshots every player GRIT daily. Check back tomorrow.</div></div>`;return}

 pushFeed({who:n,amt:"JOINED",d:"added to the roster",tag:"TEAM"});

function delPlayer(id){const p=S.players.find(x=>x.id===id);
 if(!confirm("Remove "+p.n+"? Their points history stays on The Tape."))return;

 S.players=S.players.filter(x=>x.id!==id);if(S.viewAs===id)S.viewAs=S.players[0]?.id??null;save();render()}
function setMax(id,m,v){const p=S.players.find(x=>x.id===id);if(!p.mx)p.mx={};
 const old=p.mx[m];p.mx[m]=v===""?null:+v;
 if(v!==""&&old!=null&&+v>old&&!UNI.has(m)){pushFeed({who:p.n,amt:"NEW PR",d:METRIC_LABEL[m]+" "+old+" → "+v,tag:"PR",hot:1});celebrate("NEW PR!")}

function autoKind(n){n=n.toLowerCase();
 return /grade|gpa|absence|tardy|detention|attendance|attend|test|quiz|homework|study hall|max|\bpr\b|dash|jump|sprint|mph|lift|bench|squat|clean|weight|conditioning|film|7-on-7|practice|drill|camp|fundrais|sale|sold|sponsor|survey|clearance|popcorn|ticket|donat|\$/.test(n)?"tan":"int"}
function addAct(){const n=document.getElementById("naName").value.trim();const p=parseInt(document.getElementById("naPts").value,10);
 if(!n||isNaN(p)||p===0){toast("NAME + POINTS");return}
 const k=autoKind(n);
 S.team.cfg.activities.push([n,p,k]);
 document.getElementById("naName").value="";document.getElementById("naPts").value="";
 save();cfgSync();render();toast("ADDED \u00b7 "+(k==="tan"?"TANGIBLE":"INTANGIBLE"))}
function tglRest(i){const r=S.team.cfg.restDays;const ix=r.indexOf(i);ix>=0?r.splice(ix,1):r.push(i);save();cfgSync();render()}

function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();

 r.readAsText(f)}

var cloudUser=null, athleteData=null, athEarnOpen=false;
function cloudOn(){return !!window.RMXCloud}
function isAthleteDevice(){return cloudOn()&&RMXCloud.meta().role==="athlete"}
function cloudInit(){
 if(!cloudOn())return;
 if(isAthleteDevice()){athleteRefresh();return}
 RMXCloud.session().then(s=>{cloudUser=(s&&s.user)||null;
  if(cloudUser&&/access_token/.test(location.hash)){try{history.replaceState(null,"",location.pathname)}catch(e){}}
  let pend=null;try{pend=sessionStorage.getItem("rmx.pull");sessionStorage.removeItem("rmx.pull")}catch(e){}
  if(cloudUser&&pend){toast("PULLING TEAM…");
   RMXCloud.pullTeam(pend).then(d=>{applyPull(d);tab="board";render();toast("TEAM LOADED")}).catch(()=>toast("PULL FAILED"));return}
  // AUTO-PUSH: signed-in coach with a local team not yet in the cloud -> push without asking
  if(cloudUser&&S.team&&!RMXCloud.meta().teamId&&RMXCloud.meta().role!=="athlete"){
   toast("BACKING UP TO CLOUD…");cloudPush();return}
  if(cloudUser)render()}).catch(()=>{});
}

function applyPull(d){
 const map={};
 S.team={name:d.team.name,season:d.team.season,code:d.team.join_code,cfg:d.team.cfg,createdAt:now()};
 S.players=d.players.map(p=>{const id=uid();map[p.id]=id;
  return {id,n:p.name,i:p.initials||initials(p.name),pos:p.pos||"",grade:p.grade||11,h:p.height_in,w:p.weight_lb,mx:p.mx||{},fact:p.fact||"",sq:p.sq||null}});
 S.events=d.events.map(e=>({id:uid(),pids:(e.player_ids||[]).map(u=>map[u]).filter(Boolean),act:e.act,pts:e.pts,cat:e.cat,note:e.note||"",by:"coach",date:e.event_date,ts:new Date(e.created_at).getTime()}));
 S.feed=d.feed.map(f=>({ts:new Date(f.created_at).getTime(),who:f.who,amt:f.amt,d:f.d,tag:f.tag,hot:f.hot?1:0}));
 S.viewAs=S.players[0]?S.players[0].id:null;
 if(S.team.cfg&&S.team.cfg.squads)S.team.cfg.squads.forEach(s=>{if(map[s.leader])s.leader=map[s.leader]});
 const meta=RMXCloud.meta();Object.keys(map).forEach(u=>{meta.playerMap[map[u]]=u});RMXCloud.saveMeta();
 save();
}

    <div style="flex:1;font-weight:700;font-size:14px">${esc(s.name)}${s.name===myName?" ★":""}</div>
    <span class="gold-num" style="font-size:16px">${s.avg}</span><span class="tag">AVG</span></div>`).join("")+`</div>`})()+
 (function(){const acts=(d.team&&d.team.cfg&&d.team.cfg.activities)||[];if(!acts.length)return "";
  if(!athEarnOpen)return `<div class="card" style="cursor:pointer" onclick="athEarnOpen=1;render()"><div class="row" style="justify-content:space-between"><div><span class="sub" style="color:var(--gold);opacity:1">HOW TO EARN</span><div class="small" style="margin-top:3px">${acts.length} ways to score for you and your squad — tap to see the menu</div></div><span style="color:var(--gold);font-size:20px;font-weight:800">›</span></div></div>`;
  return `<div class="card"><div class="row" style="justify-content:space-between;cursor:pointer" onclick="athEarnOpen=0;render()"><span class="sub" style="color:var(--gold);opacity:1">HOW TO EARN</span><span class="tag">CLOSE ✕</span></div>`+
   acts.map(a=>`<div class="listrow" style="padding:7px 0"><div style="flex:1;font-weight:600;font-size:12.5px">${esc(a[0])}</div><span class="ink-num" style="font-size:15px;color:${a[1]<0?"var(--red)":"var(--gold)"}">${a[1]>0?"+":""}${a[1]}</span></div>`).join("")+
   `<div class="small" style="margin-top:8px">Gold earns, red costs. Every point counts for you and your crew.</div></div>`})()+
 (d.trivia_fact&&!d.trivia_answered?`<div class="card"><div class="sub" style="margin-bottom:6px">TEAMMATE TRIVIA · FIRST CORRECT +2</div>
   <div class="marker" style="font-size:15px;margin-bottom:8px">Which teammate ${esc(d.trivia_fact)}?</div>
   ${(d.players||[]).map(p=>`<button class="pill" style="margin:3px" onclick="athleteTrivia('${p.id}')">${esc(p.name)}</button>`).join("")}</div>`
  :d.trivia_answered?`<div class="card"><div class="small">Trivia answered today — back tomorrow.</div></div>`:"")+
 (d.vote?`<div class="card"><div class="sub" style="margin-bottom:6px">TEAM VOTE · ${esc(d.vote.title||"")}</div>
   ${(d.vote.cand_ids||[]).map(id=>{const p=(d.players||[]).find(x=>x.id===id);
    return p?`<button class="pill" style="margin:3px" onclick="athleteBallot('${d.vote.id}','${id}')">${esc(p.name)}</button>`:""}).join("")}</div>`:"")+
 `<div class="card"><div class="sub" style="margin-bottom:6px">THE TAPE</div>`+
  (d.feed||[]).slice(0,12).map(f=>`<div class="listrow"><div style="flex:1"><b style="font-size:13px">${esc(f.who)}</b> <span class="small">${esc(f.d)}</span></div><span class="gold-num">${esc(f.amt)}</span></div>`).join("")+`</div>`+
 `<button class="btn sec" onclick="athleteRefresh()">REFRESH</button>
 <button class="pill" style="margin-top:10px" onclick="tab='home';render()">‹ HOME</button>`;
}
function athleteTrivia(id){RMXCloud.athleteTrivia(id).then(r=>{toast(r.correct?(r.pts===2?"FIRST IN! +2":"CORRECT +1"):"NOT TODAY");
 if(r.correct)celebrate(r.pts===2?"FIRST IN! +2":"+1");athleteRefresh()}).catch(()=>toast("TRY AGAIN"))}
function athleteBallot(v,p){RMXCloud.athleteBallot(v,p).then(()=>{toast("VOTE IN");athleteRefresh()}).catch(()=>toast("TRY AGAIN"))}
/* ================= ROUTER ================= */
const tabsDef=[["board","BOARD","bars"],["huddle","HUDDLE","hexi"],["tape","TAPE","tape"],["team","TEAM",""]];
function render(){
 document.documentElement.classList.toggle("dark",!!S.dark);
 try{document.getElementById("qaBtn").style.display=(S.team&&isCoach()&&!isAthleteDevice())?"inline-block":"none"}catch(e){}
 document.getElementById("darkBtn").textContent=S.dark?"LIGHT":"DARK";
 document.getElementById("roleBtn").textContent=S.role.toUpperCase();
 document.getElementById("tbTeam").textContent=S.team?S.team.name.toUpperCase():"RISE METRIX";
 if(tab==="home"){vSetup();return}
 if(isAthleteDevice()){vAthlete();return}
 if(tab==="teams"){vTeams();return}
 if(!S.team){vSetup();return}
 snapshotToday();
 document.getElementById("nav").style.display="flex";
 ({board:vBoard,player:vPlayer,award:vAward,huddle:vHuddle,tape:vTape,team:vTeam,draft:vDraft,assign:vAssign,bonus:vBonus,plan:vPlan,squad:vSquadView})[tab]();
 document.getElementById("nav").innerHTML=tabsDef.map(t=>`<button class="${tab===t[0]||(tab==="player"&&t[0]==="board")||(t[0]==="assign"&&(tab==="award"||tab==="bonus"))?"on":""}" onclick="tab='${t[0]}';render()">
  <span class="ic ${t[2]}">${t[2]==="bars"?'<i style="height:8px"></i><i style="height:13px"></i><i style="height:18px"></i>':""}</span>${t[1]}</button>`).join("");
 try{window.scrollTo(0,0)}catch(e){}
}
load();render();
try{if(sessionStorage.getItem("rmx.gojoin")&&!S.team){sessionStorage.removeItem("rmx.gojoin");setupStep=9;render()}}catch(e){}
setTimeout(cloudInit,400); // let cloud.js finish loading, then pick up sessions / athlete mode
console.log("RMX boot ok — team:",!!S.team,"players:",S.players.length);
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
